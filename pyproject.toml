[project]
name = "deepseek-search-fetch-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server providing web search and web page fetching through the official DeepSeek Search / Fetch API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "web4theme" }]
keywords = ["mcp", "deepseek", "search", "fetch", "web", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
deepseek-search-fetch = "deepseek_search_fetch.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_search_fetch"]

[tool.uv]
package = true
